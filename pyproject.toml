[project]
name = "nn-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "commitizen>=4.9.1",
    "numpy>=2.3.4",
    "pre-commit>=4.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
